<title>Карточки: Unit 2 и Unit 4</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f7f7f5;--card:#ffffff;--text:#1d1d1b;--muted:#6b6b66;--accent:#2e5c8a;--ok:#2e7d4f;--bad:#b23b3b;--line:#e2e2dd;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171816;--card:#20211f;--text:#ecece7;--muted:#9a9a94;--accent:#7fb0e0;--ok:#6cc08b;--bad:#e07a7a;--line:#33342f;}}
:root[data-theme="dark"]{--bg:#171816;--card:#20211f;--text:#ecece7;--muted:#9a9a94;--accent:#7fb0e0;--ok:#6cc08b;--bad:#e07a7a;--line:#33342f;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:light dark}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px;border-radius:10px;font-size:14px;cursor:pointer}
.pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.meta{font-size:14px;color:var(--muted);margin-bottom:10px}
.flip{perspective:1000px;height:360px;cursor:pointer;margin-bottom:14px}
.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.open .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;padding:20px;text-align:center;overflow-y:auto;overflow-x:hidden;word-wrap:break-word;overflow-wrap:anywhere}
.back{transform:rotateY(180deg)}
.face .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.face .txt{font-size:17px;line-height:1.4;margin:auto 0}
.hint{font-size:13px;color:var(--muted);margin-top:12px}
.btns{display:flex;gap:10px}
.btn{flex:1;border:none;padding:14px;border-radius:12px;font-size:16px;color:#fff;cursor:pointer}
.bad{background:var(--bad)}.ok{background:var(--ok)}.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.stats{font-size:14px;color:var(--muted);text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Карточки: слова Unit 2 и 4</h1>
  <div class="row">
    <button class="pill on" id="m-tr" onclick="setMode('tr')">Слова</button>
    <button class="pill" id="m-qa" onclick="setMode('qa')">Вопросы</button>
    <button class="pill" id="dir" onclick="toggleDir()">EN → RU</button>
  </div>
  <div class="row">
    <button class="pill on" id="u-all" onclick="setUnit('all')">Все</button>
    <button class="pill" id="u-2" onclick="setUnit('2')">Unit 2</button>
    <button class="pill" id="u-4" onclick="setUnit('4')">Unit 4</button>
  </div>
  <div class="meta" id="meta"></div>
  <div class="flip" id="card" onclick="this.classList.toggle('open')">
    <div class="inner">
      <div class="face"><div class="lbl" id="lblF"></div><div class="txt" id="front"></div><div class="hint" id="frontRu" style="margin-top:10px;font-size:15px;color:var(--text)"></div><div class="hint">нажмите, чтобы перевернуть</div></div>
      <div class="face back"><div class="lbl">Ответ</div><div class="txt" id="back"></div><div class="hint" id="backRu" style="margin-top:10px;font-size:15px;color:var(--text)"></div></div>
    </div>
  </div>
  <div class="btns">
    <button class="btn bad" onclick="answer(false)">Не знаю</button>
    <button class="btn ok" onclick="answer(true)">Знаю</button>
  </div>
  <div class="row" style="margin-top:12px;justify-content:center">
    <button class="pill" onclick="shuffle()">Перемешать</button>
    <button class="pill" onclick="restart()">Начать заново</button>
  </div>
  <div class="stats" id="stats"></div>
</div>

ree / course", "ru": "магистратура"}, {"u": "2", "en": "postgraduate degree / course", "ru": "аспирантура"}, {"u": "4", "en": "to accept an apprenticeship", "ru": "согласиться на стажировку"}, {"u": "4", "en": "to be involved in something", "ru": "участвовать в чём-либо, быть вовлечённым во что-либо"}, {"u": "4", "en": "to claim", "ru": "утверждать, заявлять"}, {"u": "4", "en": "to explore", "ru": "исследовать"}, {"u": "4", "en": "to generate attention", "ru": "привлекать внимание"}, {"u": "4", "en": "to honour", "ru": "чтить, почитать"}, {"u": "4", "en": "to invent", "ru": "изобретать"}, {"u": "4", "en": "to keep up with (something)", "ru": "гнаться, поспевать за (чем-либо)"}, {"u": "4", "en": "to lay the foundation(s)", "ru": "заложить основы"}, {"u": "4", "en": "to outperform", "ru": "превосходить (по техническим характеристикам), опережать"}, {"u": "4", "en": "to pave the way (for/to)", "ru": "проложить путь (для/к)"}, {"u": "4", "en": "to predict", "ru": "прогнозировать, предсказывать"}, {"u": "4", "en": "to purchase the rights", "ru": "приобрести права"}, {"u": "4", "en": "to recognize", "ru": "выражать признание"}, {"u": "4", "en": "to share the recipe", "ru": "поделиться рецептом"}, {"u": "4", "en": "to smuggle", "ru": "заниматься контрабандой"}, {"u": "4", "en": "to tackle", "ru": "взяться за дело, решить"}, {"u": "4", "en": "to wear down", "ru": "изнашиваться"}, {"u": "4", "en": "accessible", "ru": "доступный"}, {"u": "4", "en": "essential", "ru": "существенный, необходимый"}, {"u": "4", "en": "groundbreaking", "ru": "совершающий прорыв, новаторский"}, {"u": "4", "en": "achievement", "ru": "достижение"}, {"u": "4", "en": "application", "ru": "приложение, применение"}, {"u": "4", "en": "artificial intelligence", "ru": "искусственный интеллект"}, {"u": "4", "en": "assembly line", "ru": "конвейер"}, {"u": "4", "en": "attempt", "ru": "попытка"}, {"u": "4", "en": "award", "ru": "награда, премия"}, {"u": "4", "en": "breakthrough", "ru": "прорыв"}, {"u": "4", "en": "contribution", "ru": "вклад"}, {"u": "4", "en": "convenience", "ru": "удобство; устройство"}, {"u": "4", "en": "cornerstone", "ru": "краеугольный камень, фундамент, основа"}, {"u": "4", "en": "discovery", "ru": "открытие"}, {"u": "4", "en": "efficiency", "ru": "эффективность"}, {"u": "4", "en": "elaborate marketing campaign", "ru": "продуманная маркетинговая кампания"}, {"u": "4", "en": "engine", "ru": "двигатель"}, {"u": "4", "en": "enterprise", "ru": "предприятие"}, {"u": "4", "en": "founder", "ru": "основатель"}, {"u": "4", "en": "high-tech security features", "ru": "высокотехнологичные функции безопасности"}, {"u": "4", "en": "impact", "ru": "влияние"}, {"u": "4", "en": "invention", "ru": "изобретение"}, {"u": "4", "en": "legacy", "ru": "наследие"}, {"u": "4", "en": "light bulb", "ru": "электрическая лампочка"}, {"u": "4", "en": "manufacturing might", "ru": "производственная мощь"}, {"u": "4", "en": "vault", "ru": "хранилище"}, {"u": "4", "en": "vehicle", "ru": "транспортное средство"}];
const QA = [{"u": "2", "q": "2.1 · What is higher education in the UK known for? Approximately how many universities are there, and what are the most well-known ones?", "qr": "Чем известно высшее образование в Великобритании? Сколько там примерно университетов и какие самые известные?", "a": "Known for high academic standards and practical focus. The UK has over 160 universities; Oxford, Cambridge and Imperial College London are among the best known.", "ar": "Высокие академические стандарты и практическая направленность. В стране более 160 университетов; Оксфорд, Кембридж и Imperial College London — среди самых известных."}, {"u": "2", "q": "2.1 · According to the text, what types of colleges does the UK have in addition to traditional universities? What is the main purpose of these colleges? Why are they popular with students?", "qr": "Какие колледжи есть в Великобритании помимо традиционных университетов? Какова их главная цель? Почему они популярны у студентов?", "a": "Vocational Further Education (FE) colleges. They offer practical, job-focused programmes and are popular because they teach specific skills and lead to jobs faster.", "ar": "Профессиональные колледжи дополнительного образования (FE). Дают практические программы, ориентированные на работу; популярны, потому что учат конкретным навыкам и быстрее ведут к работе."}, {"u": "2", "q": "2.1 · When do students enter university in the UK, and how long does it typically take to complete a bachelor's degree in the UK?", "qr": "Когда студенты поступают в университет в Великобритании и сколько обычно длится бакалавриат?", "a": "After finishing secondary school. An undergraduate programme (BA, BSc, BEng) usually takes three years; an integrated MEng takes four.", "ar": "После окончания средней школы. Бакалавриат (BA, BSc, BEng) обычно длится три года; интегрированная программа MEng — четыре."}, {"u": "2", "q": "2.1 · What options are available to students after earning their undergraduate degree in the UK? How long does it take to earn a master's degree in the UK?", "qr": "Какие варианты есть после бакалавриата в Великобритании? Сколько длится магистратура?", "a": "Postgraduate programmes (MA, MSc, MRes). A master's usually lasts one year; those aiming for research often go on to a PhD.", "ar": "Программы послевузовского обучения (MA, MSc, MRes). Магистратура обычно длится один год; тем, кто идёт в науку, часто подходит PhD."}, {"u": "2", "q": "2.1 · Talk about teaching methods in the UK universities.", "qr": "Расскажите о методах обучения в университетах Великобритании.", "a": "Theory and practice are combined: lectures, seminars, labs and group projects, plus tutorials at Oxford and Cambridge (small discussion sessions with personal feedback).", "ar": "Теория и практика: лекции, семинары, лаборатории и групповые проекты, а в Оксфорде и Кембридже — туториалы (небольшие занятия с обсуждением и личной обратной связью)."}, {"u": "2", "q": "2.1 · What is a sandwich course in the context of UK higher education, and what is the benefit of this course for students?", "qr": "Что такое «сэндвич-курс» в британском высшем образовании и в чём его польза для студентов?", "a": "A programme with a year-long work placement between the second and final year, common in engineering. Students apply their knowledge in a real working environment.", "ar": "Программа с годичной практикой между вторым и последним курсом, распространённая в инженерии. Студенты применяют знания в реальной рабочей среде."}, {"u": "2", "q": "2.1 · How are students assessed during education?", "qr": "Как оценивают студентов в процессе обучения?", "a": "By exams, coursework, presentations and final projects.", "ar": "Экзаменами, курсовыми работами, презентациями и итоговыми проектами."}, {"u": "2", "q": "2.1 · Describe the typical housing situation for students according to the text — what may change between the first year and later years?", "qr": "Опишите типичное жильё студентов по тексту — что меняется между первым годом и старшими курсами?", "a": "First-years usually live in university accommodation (halls of residence); later they often rent shared flats or houses.", "ar": "Первокурсники обычно живут в университетском общежитии (halls of residence); на старших курсах часто снимают общие квартиры или дома."}, {"u": "2", "q": "2.1 · Talk about Oxford tutorials. What are the key features of tutorials according to the video (ex. 16b p.76)?", "qr": "Расскажите об оксфордских туториалах. Каковы их ключевые особенности по видео (упр. 16b, стр. 76)?", "a": "Small groups or one-on-one with a tutor. Weekly problems and essays, then a session where the tutor marks and discusses the work. Honest feedback in a relaxed, equal conversation.", "ar": "Небольшие группы или занятие один на один с тьютором. Каждую неделю задачи и эссе, затем разбор работы. Честная обратная связь в расслабленной беседе на равных."}, {"u": "2", "q": "2.1 · What is the main difference between lectures and tutorials according to the video (ex. 16b p.76)?", "qr": "В чём главное отличие лекций от туториалов по видео (упр. 16b, стр. 76)?", "a": "Lectures are crowded; tutorials are small, and you discuss your work with a tutor, getting direct and instant feedback in an informal conversation.", "ar": "Лекции переполнены; туториалы малочисленны, и вы обсуждаете свою работу с тьютором, получая прямую и мгновенную обратную связь в неформальной беседе."}, {"u": "2", "q": "2.1 · What syndrome do most students have at the beginning of their education? What does it mean? (according to the video ex. 23b p.82)", "qr": "Какой синдром есть у большинства студентов в начале учёбы? Что он означает? (по видео, упр. 23b, стр. 82)", "a": "Imposter syndrome: the belief that you are not good enough, not experienced enough, or that you do not belong at university.", "ar": "Синдром самозванца: убеждённость, что вы недостаточно хороши, недостаточно опытны или что вам не место в университете."}, {"u": "2", "q": "2.1 · What is the main misconception about engineering students at Oxford? What is the engineering student body like? (according to the video ex. 23b p.82)", "qr": "Какое главное заблуждение об инженерах в Оксфорде? Каковы студенты-инженеры? (по видео, упр. 23b, стр. 82)", "a": "That they are nerdy and only work. In reality they are sociable and friendly, and their differences help them find different solutions.", "ar": "Что они зануды, которые только работают. На самом деле они общительные и приятные люди, а их различия помогают находить разные решения."}, {"u": "2", "q": "2.1 · What is the engineering science department made up of? (according to the video ex. 23b p.82)", "qr": "Из чего состоит факультет инженерных наук? (по видео, упр. 23b, стр. 82)", "a": "Several buildings: a main lecture building, many labs for practical work, study spaces and access to a machine workshop.", "ar": "Несколько зданий: главный корпус для лекций, много лабораторий для практики, места для самостоятельной работы и доступ к механической мастерской."}, {"u": "2", "q": "2.2 · What is a community college? What are the benefits to attending a community college? (according to the video ex. 10b p.94)", "qr": "Что такое community college? Каковы преимущества учёбы в нём? (по видео, упр. 10b, стр. 94)", "a": "A two-year school offering affordable higher education as a pathway to a four-year university. Benefits: lower price, smaller classes and other programmes such as high school completion and ESL.", "ar": "Двухлетняя школа с доступным высшим образованием как путём в четырёхлетний университет. Преимущества: низкая цена, небольшие группы и другие программы, например, завершение школы и ESL."}, {"u": "2", "q": "2.2 · List the 3 myths about a community college that the video mentions and explain why they are not true (according to the video ex. 10b p.94).", "qr": "Назовите 3 мифа о community college из видео и объясните, почему они неверны (упр. 10b, стр. 94).", "a": "1) No student life: false, there are clubs, a gym and student government. 2) Hard to transfer: false, there are transfer guarantees and centres. 3) You are on your own: false, there is international support.", "ar": "1) Нет студенческой жизни: неверно, есть клубы, спортзал и студсовет. 2) Трудно перевестись: неверно, есть гарантии перевода и центры перевода. 3) Вы предоставлены сами себе: неверно, есть международная поддержка."}, {"u": "2", "q": "2.2 · What has the U.S. higher education system always aimed to do?", "qr": "К чему всегда стремилась система высшего образования США?", "a": "To prepare students for their intended careers, while changing its structure to meet the demands of a dynamic job market.", "ar": "Готовить студентов к их карьере, при этом меняя структуру под требования динамичного рынка труда."}, {"u": "2", "q": "2.2 · What do students need to do to earn a degree in the USA?", "qr": "Что нужно сделать студентам, чтобы получить степень в США?", "a": "Fulfil the requirements of their chosen programme at a university, community college or specialised school, including passing exams.", "ar": "Выполнить требования выбранной программы в университете, community college или специализированной школе, включая сдачу экзаменов."}, {"u": "2", "q": "2.2 · What does the text say about compulsory and elective courses in U.S. higher education?", "qr": "Что сказано в тексте об обязательных и элективных курсах в высшем образовании США?", "a": "Some courses are compulsory and others are elective (chosen by the student), so students can shape their education around their interests.", "ar": "Одни курсы обязательные, другие элективные (по выбору студента), поэтому студенты могут строить обучение под свои интересы."}, {"u": "2", "q": "2.2 · Why are community colleges popular among students in the USA, and what types of degrees do they offer?", "qr": "Почему community colleges популярны у студентов в США и какие степени они дают?", "a": "They are cheaper and suit students who are unsure of their major. Two-year programmes lead to a certificate, an associate degree, or a transfer to a university.", "ar": "Они дешевле и подходят тем, кто ещё не выбрал специальность. Двухлетние программы дают сертификат, степень младшего специалиста или перевод в университет."}, {"u": "2", "q": "2.2 · What is the most common type of higher education institution for pursuing a bachelor's degree in the USA, and how long does it typically take to complete?", "qr": "Какое учебное заведение чаще всего выбирают для бакалавриата в США и сколько он длится?", "a": "Universities: over 2,300 four-year institutions, and students usually spend four years there.", "ar": "Университеты: более 2300 четырёхлетних учебных заведений; обучение обычно длится четыре года."}, {"u": "2", "q": "2.2 · What does obtaining an advanced degree allow students to do, and what does it require?", "qr": "Что даёт продвинутая степень и что для неё требуется?", "a": "It opens doors to more specialised careers. It requires significant dedication, critical thinking and a lot of research.", "ar": "Открывает двери к более узкой карьерной специализации. Требует серьёзной самоотдачи, критического мышления и большого объёма исследований."}, {"u": "2", "q": "2.2 · What are the names for each year of an undergraduate degree in the US higher education system? (according to the video ex. 19b p.104)", "qr": "Как называется каждый год бакалавриата в системе высшего образования США? (по видео, упр. 19b, стр. 104)", "a": "Freshman (1st), sophomore (2nd), junior (3rd), senior (4th, the final year).", "ar": "Freshman (1-й), sophomore (2-й), junior (3-й), senior (4-й, последний)."}, {"u": "2", "q": "2.2 · How long does the academic year run in the US higher education system, and how many semesters are there? (according to the video ex. 19b p.104)", "qr": "Сколько длится учебный год в США и сколько в нём семестров? (по видео, упр. 19b, стр. 104)", "a": "About nine months with two semesters a year. Each semester students take 4–5 courses and earn academic credits.", "ar": "Около девяти месяцев, два семестра в году. В каждом семестре 4–5 курсов и зачётные кредиты."}, {"u": "2", "q": "2.2 · What is MIT? What reputation does it have? What has the pace of learning at MIT been likened to?", "qr": "Что такое MIT? Какая у него репутация? С чем сравнивают темп обучения в MIT?", "a": "The Massachusetts Institute of Technology, ranked number one in the world by QS. It has a stellar reputation and very hard demands; the pace is likened to \"drinking from a firehose\".", "ar": "Массачусетский технологический институт, первый в мире по рейтингу QS. Безупречная репутация и очень жёсткие требования; темп сравнивают с «питьём из пожарного шланга»."}, {"u": "2", "q": "2.2 · What is the admission to MIT like? What kind of students does MIT seek?", "qr": "Каково поступление в MIT? Каких студентов там ищут?", "a": "Highly competitive. MIT looks for exceptional students who are academically strong and show initiative and intellectual curiosity.", "ar": "Очень конкурентное. MIT ищет выдающихся студентов, сильных в учёбе, с инициативой и интеллектуальной любознательностью."}, {"u": "2", "q": "2.2 · What does MIT focus on?", "qr": "На чём делает упор MIT?", "a": "Personal growth and individual learning styles. Information is not spoon-fed, so students find their own way to learn and solve unconventional problems.", "ar": "На личностный рост и индивидуальные стили обучения. Знания не разжёвывают, поэтому студенты сами находят способ учиться и решать нестандартные задачи."}, {"u": "2", "q": "2.3 · What types of higher engineering institutions are there in Russia?", "qr": "Какие типы инженерных вузов есть в России?", "a": "State and non-state accredited institutions: national universities (e.g. MSU, SPbSU), federal universities, national research universities, universities, academies and institutes.", "ar": "Государственные и негосударственные аккредитованные вузы: национальные университеты (например, МГУ, СПбГУ), федеральные университеты, национальные исследовательские университеты, университеты, академии и институты."}, {"u": "2", "q": "2.3 · What are the admission criteria for engineering universities in Russia?", "qr": "Каковы критерии поступления в инженерные вузы России?", "a": "Competitive, based on Unified State Exam (USE) results, with high marks in subjects related to the speciality, such as maths, physics and computer science.", "ar": "Конкурс по результатам ЕГЭ с высокими баллами по профильным предметам, например математике, физике и информатике."}, {"u": "2", "q": "2.3 · What qualifications are available for higher engineering education in Russia according to the 2012 \"Law on Education\"?", "qr": "Какие квалификации есть в высшем инженерном образовании России по Закону об образовании 2012 года?", "a": "Three: Bachelor's, Master's and Specialist's diplomas.", "ar": "Три: диплом бакалавра, диплом магистра и диплом специалиста."}, {"u": "2", "q": "2.3 · How long does it usually take to complete a Bachelor's degree and a Master's degree in Russia?", "qr": "Сколько обычно длятся бакалавриат и магистратура в России?", "a": "Bachelor's: four years of full-time study. Master's: usually two years.", "ar": "Бакалавриат — четыре года очной формы. Магистратура — обычно два года."}, {"u": "2", "q": "2.3 · What options are available for students who work while studying?", "qr": "Какие варианты есть для студентов, которые работают?", "a": "Part-time (evening) and e-learning (correspondence) study. They take longer to complete.", "ar": "Вечерняя и дистанционная (заочная) формы обучения. На них нужно больше времени."}, {"u": "2", "q": "2.3 · What subjects are included in the curriculum of engineering programs in Russia?", "qr": "Какие предметы входят в учебный план инженерных программ в России?", "a": "Core subjects such as maths and physics, plus humanities: history, philosophy and foreign languages. Undergraduate programmes are practice-oriented and focus on fundamental engineering disciplines.", "ar": "Основные предметы, например математика и физика, а также гуманитарные: история, философия и иностранные языки. Бакалавриат практико-ориентированный и делает упор на фундаментальные инженерные дисциплины."}, {"u": "2", "q": "2.3 · What career opportunities are available to graduates of a Bachelor's engineering program in Russia?", "qr": "Какие карьерные возможности есть у выпускников инженерного бакалавриата в России?", "a": "Engineers, project managers or technical consultants in various industries, or continuing to a master's degree.", "ar": "Инженеры, руководители проектов или технические консультанты в разных отраслях, либо продолжение обучения в магистратуре."}, {"u": "2", "q": "2.3 · What is a specialist degree, and how long does it last?", "qr": "Что такое диплом специалиста и сколько он длится?", "a": "A traditional Russian form of higher education lasting five years, giving comprehensive, specialised engineering training.", "ar": "Традиционная российская форма высшего образования на пять лет с всесторонней специализированной инженерной подготовкой."}, {"u": "2", "q": "2.3 · What are the final requirements for completing an engineering degree in Russia?", "qr": "Каковы итоговые требования для окончания инженерного образования в России?", "a": "Each stage ends with a degree paper (graduation thesis) and a final state examination.", "ar": "Каждый этап заканчивается дипломной работой (выпускной квалификационной работой) и итоговым государственным экзаменом."}, {"u": "2", "q": "2.3 · Are there any postgraduate programs at Russian universities? What are they?", "qr": "Есть ли программы аспирантуры в российских вузах? Что это такое?", "a": "Yes: 3–4 years, leading to Candidate of Science and Doctor of Science degrees, awarded after a public defence of a thesis with original research.", "ar": "Да: 3–4 года, степени кандидата и доктора наук, присуждаются после публичной защиты диссертации с оригинальными результатами."}, {"u": "2", "q": "2.3 · Talk about your studies. What qualification are you pursuing? What career opportunities does this qualification provide?", "qr": "Расскажите о своём обучении. Какую квалификацию вы получаете? Какие карьерные возможности она даёт?", "a": "Sample: I am studying for a Bachelor's degree in Business Informatics, a four-year full-time programme. Afterwards I can work as a project manager or technical consultant, or continue to a master's. (Adapt to your case.)", "ar": "Пример: я учусь на бакалавра по направлению «Бизнес-информатика», очно, четыре года. После этого могу работать руководителем проектов или техническим консультантом либо продолжить магистратуру. (Адаптируйте под себя.)"}, {"u": "4", "q": "4.1 · What was revolutionary about Gutenberg's concept? How long had the printing press stayed unchanged before it began to evolve?", "qr": "В чём была революционность концепции Гутенберга? Сколько печатный станок оставался неизменным?", "a": "Movable type: single metal characters that could be arranged and rearranged into words and text blocks. The press's mechanics then stayed almost unchanged for 300 years.", "ar": "Подвижный шрифт: отдельные металлические буквы, которые можно переставлять в слова и блоки текста. Затем устройство станка почти не менялось 300 лет."}, {"u": "4", "q": "4.1 · Why did the early printing presses wear down quickly?", "qr": "Почему ранние печатные станки быстро изнашивались?", "a": "They needed great force, so the wood cracked and the metal type wore down.", "ar": "Им требовалась большая сила, поэтому дерево трескалось, а металлический шрифт изнашивался."}, {"u": "4", "q": "4.1 · Who is recognized as the inventor of the electric light bulb? What key elements led to the triumph of his version of the incandescent light bulb?", "qr": "Кому приписывают изобретение электрической лампочки? Какие ключевые элементы принесли успех его версии?", "a": "Thomas Edison (1879). His version worked better thanks to effective materials, a higher vacuum and high resistance, which made centralised power distribution economically viable.", "ar": "Томас Эдисон (1879). Его версия оказалась лучше благодаря эффективным материалам, высокому вакууму и высокому сопротивлению, что сделало централизованное распределение энергии экономически выгодным."}, {"u": "4", "q": "4.1 · What breakthrough was made by the Wright brothers?", "qr": "Какой прорыв совершили братья Райт?", "a": "On 17 December 1903 they made the first successful flight of a powered airplane, the Flyer; Orville's flight lasted 12 seconds.", "ar": "17 декабря 1903 года они совершили первый успешный полёт самолёта с мотором, Flyer; полёт Орвилла длился 12 секунд."}, {"u": "4", "q": "4.1 · What contraptions preceded the first airplane invented by the Wright brothers?", "qr": "Какие устройства были до первого самолёта братьев Райт?", "a": "Kites, balloons and gliders.", "ar": "Воздушные змеи, воздушные шары и планёры."}, {"u": "4", "q": "4.1 · What do you know about the invention made by Joseph Nicéphore Niépce?", "qr": "Что вы знаете об изобретении Жозефа Ньепса?", "a": "A French inventor who made a prototype photographic camera in 1816 and took the oldest surviving photograph in 1826.", "ar": "Французский изобретатель, создавший прототип фотоаппарата в 1816 году и сделавший самую старую сохранившуюся фотографию в 1826 году."}, {"u": "4", "q": "4.1 · What breakthrough in automotive industry was made by Carl Benz?", "qr": "Какой прорыв в автомобилестроении совершил Карл Бенц?", "a": "He patented a gas-powered car engine, starting the automobile era and leading to the creation of Mercedes-Benz.", "ar": "Он запатентовал бензиновый двигатель для автомобиля, что положило начало эре автомобиля и привело к созданию Mercedes-Benz."}, {"u": "4", "q": "4.1 · What was Henry Ford's contribution to the development of automotive industry?", "qr": "Каков вклад Генри Форда в развитие автомобильной промышленности?", "a": "He used mass production, including the assembly line, to make cars cheaper, paving the way for the global automotive industry.", "ar": "Он применил массовое производство, в том числе конвейер, сделав автомобили дешевле, и проложил путь мировой автомобильной промышленности."}, {"u": "4", "q": "4.1 · Who was Alexander Graham Bell? What did he invent? (according to the video in unit 4.1, ex.15)", "qr": "Кто такой Александр Грэм Белл? Что он изобрёл? (по видео, раздел 4.1, упр. 15)", "a": "The creator of the first telephone. Raised around sound, he became a teacher of the deaf in Boston and dreamed of machines that let people talk over a distance.", "ar": "Создатель первого телефона. Вырос среди звуков, стал учителем глухих в Бостоне и мечтал о машине, которая позволит людям говорить на расстоянии."}, {"u": "4", "q": "4.1 · Why is the date March 10th 1876 important? What happened on that day? (according to the video in unit 4.1, ex.15)", "qr": "Почему 10 марта 1876 года важно? Что произошло в этот день? (по видео, раздел 4.1, упр. 15)", "a": "Bell and his assistant Thomas Watson heard each other through wires for the first time: the first telephone call in history. He patented the invention right away.", "ar": "Белл и его помощник Томас Уотсон впервые услышали друг друга по проводам — это первый телефонный звонок в истории. Изобретение он сразу запатентовал."}, {"u": "4", "q": "4.2 · What is Alfred Nobel famous for? What is his most prominent invention?", "qr": "Чем известен Альфред Нобель? Каково его самое известное изобретение?", "a": "Founder of the Nobel Prize; he made his fortune from explosives, most notably dynamite. He worked as a chemist and engineer.", "ar": "Основатель Нобелевской премии; заработал состояние на взрывчатых веществах, самое известное — динамит. Работал химиком и инженером."}, {"u": "4", "q": "4.2 · How was the Nobel Prize established? (according to the video in unit 4.2, ex.5)", "qr": "Как была учреждена Нобелевская премия? (по видео, раздел 4.2, упр. 5)", "a": "Nobel left most of his wealth in a trust to fund annual international awards for achievements in different fields.", "ar": "Нобель оставил большую часть состояния в фонд, на который финансируются ежегодные международные награды за достижения в разных областях."}, {"u": "4", "q": "4.2 · Describe the selection process for the Nobel Prize winners. (according to the video in unit 4.2, ex.5)", "qr": "Опишите процесс отбора лауреатов Нобелевской премии. (по видео, раздел 4.2, упр. 5)", "a": "About 3,000 academics nominate candidates; around 300 are chosen, and the laureates are selected by vote. Winners get a gold medal, a diploma and money.", "ar": "Около 3000 учёных выдвигают кандидатов; из них отбирают около 300, а лауреатов определяют голосованием. Победители получают золотую медаль, диплом и деньги."}, {"u": "4", "q": "4.2 · What fields is the Nobel Prize awarded in?", "qr": "В каких областях присуждается Нобелевская премия?", "a": "Physics, chemistry, physiology or medicine, literature, economics and peace.", "ar": "Физика, химия, физиология или медицина, литература, экономика и мир."}, {"u": "4", "q": "4.2 · What is the maximum number of laureates that can receive a single award, and what is the exception? (unit 4.2, ex.5)", "qr": "Какое максимальное количество лауреатов может получить одну награду и какое исключение? (раздел 4.2, упр. 5)", "a": "Up to 3 laureates per award. The exception is the Peace Prize, which can be awarded to institutions.", "ar": "До 3 лауреатов на одну награду. Исключение — премия мира, которую можно присудить учреждениям."}, {"u": "4", "q": "4.2 · What are some examples of famous Nobel laureates mentioned in the video? (unit 4.2, ex.5)", "qr": "Приведите примеры известных лауреатов из видео. (раздел 4.2, упр. 5)", "a": "Fleming (penicillin), Einstein (the law of the photoelectric effect), Marie Curie (two prizes), and the Red Cross (three prizes for protecting prisoners of war).", "ar": "Флеминг (пенициллин), Эйнштейн (закон фотоэффекта), Мария Кюри (две премии), Красный Крест (три премии за защиту военнопленных)."}, {"u": "4", "q": "4.2 · What is Alan Turing famous for?", "qr": "Чем известен Алан Тьюринг?", "a": "Breaking the Nazi Enigma code in WWII, advancing cryptography, the foundations of modern computing, early computers such as ACE, and machine learning.", "ar": "Взлом нацистского шифра «Энигма» во время войны, развитие криптографии, основы современных вычислений, ранние компьютеры вроде ACE и машинное обучение."}, {"u": "4", "q": "4.2 · What does the concept of the Turing Machine refer to?", "qr": "К чему относится понятие машины Тьюринга?", "a": "A theoretical model (an idea, not a device), introduced in 1936, which showed how computers process information. It is still key to understanding algorithms.", "ar": "Теоретическая модель (идея, а не устройство), представленная в 1936 году, которая показала, как компьютеры обрабатывают информацию. До сих пор важна для понимания алгоритмов."}, {"u": "4", "q": "4.2 · What is the Turing Test?", "qr": "Что такое тест Тьюринга?", "a": "A test of a machine's ability to show intelligent behaviour; it is still a cornerstone of discussions about artificial intelligence.", "ar": "Тест на способность машины проявлять разумное поведение; до сих пор это основа обсуждений об искусственном интеллекте."}, {"u": "4", "q": "4.2 · What do you know about the Turing Award? What fields is it awarded in?", "qr": "Что вы знаете о премии Тьюринга? В каких областях её присуждают?", "a": "Often called the Nobel Prize of Computing, created in 1966 by the ACM. It honours work in AI, programming languages, databases and operating systems; since 2014 it includes a $1 million prize sponsored by Google.", "ar": "Её называют Нобелевской премией в области вычислений; учреждена в 1966 году ACM. Отмечает работы в ИИ, языках программирования, базах данных и операционных системах; с 2014 года включает приз в миллион долларов от Google."}, {"u": "4", "q": "4.3 · What do you know about the creation of the original recipe for the Coca-Cola drink and the shroud of mystery around it?", "qr": "Что вы знаете о создании оригинального рецепта Coca-Cola и окружающей его тайне?", "a": "John Pemberton created the drink in 1886 and shared the recipe with few people. Asa Candler bought the rights in 1891. The recipe was written down only in 1919, as collateral for a loan.", "ar": "Джон Пембертон создал напиток в 1886 году и делился рецептом с немногими. Эйса Кэндлер купил права в 1891 году. Рецепт записали только в 1919 году, как залог по кредиту."}, {"u": "4", "q": "4.3 · Where is the Coca-Cola formula kept now? What security measures protect it?", "qr": "Где сейчас хранится формула Coca-Cola? Какие меры защищают её?", "a": "In a vault at the World of Coca-Cola museum in Atlanta, protected by a palm scanner, a code pad and a steel door, with a safe box inside.", "ar": "В хранилище музея World of Coca-Cola в Атланте: защита — сканер ладони, цифровая панель и стальная дверь, внутри ещё один сейф."}, {"u": "4", "q": "4.3 · What is the purpose of creating a shroud of mystery around the Coca-Cola formula?", "qr": "Какова цель создания тайны вокруг формулы Coca-Cola?", "a": "To attract attention to the product, as part of an elaborate marketing strategy.", "ar": "Чтобы привлечь внимание к продукту в рамках продуманной маркетинговой стратегии."}, {"u": "4", "q": "4.3 · What was the industrial revolution in the USA based on according to the text? (unit 4.3)", "qr": "На чём, по тексту, основывалась промышленная революция в США? (раздел 4.3)", "a": "On intellectual property smuggled out of England.", "ar": "На интеллектуальной собственности, вывезенной контрабандой из Англии."}, {"u": "4", "q": "4.3 · How did the invention of the water-powered spinning frame change the country's industrial sector?", "qr": "Как изобретение водяной прядильной машины изменило промышленность страны?", "a": "Arkwright's frame (1771) increased cotton goods production tenfold and let factories across England keep up with the demand for textiles.", "ar": "Машина Аркрайта (1771) увеличила выпуск хлопковых товаров в десять раз и позволила фабрикам по всей Англии справляться со спросом на ткани."}, {"u": "4", "q": "4.3 · What laws did the British Parliament pass at the end of the 18th century to protect the country's industrial secrets?", "qr": "Какие законы принял британский парламент в конце XVIII века для защиты промышленных секретов?", "a": "In 1774, laws forbidding engineers and mechanics from travelling abroad.", "ar": "В 1774 году — законы, запрещавшие инженерам и механикам выезжать за границу."}, {"u": "4", "q": "4.3 · How did the technology of the water frame appear in the USA according to the text? (unit 4.3)", "qr": "Как технология водяной машины появилась в США, по тексту? (раздел 4.3)", "a": "Samuel Slater memorised the plans in England and sailed to America in 1789, where he built a factory in Rhode Island.", "ar": "Сэмюэл Слейтер запомнил чертежи в Англии и в 1789 году отплыл в Америку, где построил фабрику в Род-Айленде."}, {"u": "4", "q": "4.3 · What is the Rhode Island System?", "qr": "Что такое система Род-Айленда?", "a": "The 1803 model of factory life: Slaterville, a village around the mill with worker housing and a company store.", "ar": "Модель фабричной жизни 1803 года: Слейтервилл, посёлок вокруг фабрики с жильём для рабочих и магазином компании."}, {"u": "4", "q": "4.3 · What did Samuel Slater and Francis Lowell have in common?", "qr": "Что общего было у Сэмюэла Слейтера и Фрэнсиса Лоуэлла?", "a": "Both memorised English factory plans (the water frame and the power loom) and used them in American mills.", "ar": "Оба запомнили чертежи английских фабрик (водяной машины и механического ткацкого станка) и использовали их на американских фабриках."}, {"u": "4", "q": "4.3 · What does know-how refer to?", "qr": "Что означает know-how?", "a": "Practical knowledge or skill needed to do something.", "ar": "Практические знания или навык, необходимые, чтобы что-то делать."}, {"u": "4", "q": "4.3 · Why is it important to take all advertisement with a grain of salt?", "qr": "Почему важно относиться к рекламе с долей скепсиса?", "a": "Advertising information comes from the company's own claims, and the Coca-Cola story may be exaggerated as part of a marketing campaign.", "ar": "Информация в рекламе исходит от самой компании, а история Coca-Cola может быть преувеличена как часть маркетинговой кампании."}, {"u": "4", "q": "4.3 · What is the purpose of smuggling? Why does it still exist today?", "qr": "В чём цель контрабанды? Почему она существует и сегодня?", "a": "To take valuable secret technology abroad for success elsewhere. It persists because people have always stolen national secrets, as the Wikileaks cyber leaks show.", "ar": "Вывезти ценную секретную технологию, чтобы добиться успеха в другом месте. Существует, потому что люди всегда крали государственные секреты, как показывают утечки Wikileaks."}, {"u": "4", "q": "4.3 · What is the brain drain and why does it happen?", "qr": "Что такое «утечка мозгов» и почему она происходит?", "a": "Emigration of highly skilled people (scientists, engineers) seeking better wages, conditions and growth opportunities abroad.", "ar": "Эмиграция высококвалифицированных людей (учёных, инженеров) в поисках лучшей зарплаты, условий и возможностей роста за границей."}, {"u": "4", "q": "4.3 · What are trade secrets? What categories and examples of trade secrets are mentioned in the video? (unit 4.3, ex.15)", "qr": "Что такое коммерческая тайна? Какие категории и примеры есть в видео? (раздел 4.3, упр. 15)", "a": "Secret information kept from others. Categories: formulas, processes, designs, manufacturing methods, information compilations. Examples: Coca-Cola's recipe, KFC's eleven spices, Google's search algorithm.", "ar": "Секретная информация, скрываемая от других. Категории: формулы, процессы, конструкции, методы производства, сборники информации. Примеры: рецепт Coca-Cola, одиннадцать специй KFC, алгоритм поиска Google."}, {"u": "4", "q": "4.3 · Name Top Russian inventions that changed the world. (according to unit 4.3, ex.16)", "qr": "Назовите главные русские изобретения, которые изменили мир. (по разделу 4.3, упр. 16)", "a": "Six from the book: yoghurt (Mechnikov), helicopter (Sikorsky), radio (Popov), electric railway wagons (Pirotsky), videotape recorder (Poniatoff), caterpillar tracks (Zagryazhsky, Blinov).", "ar": "Шесть из учебника: йогурт (Мечников), вертолёт (Сикорский), радио (Попов), электрические вагоны (Пироцкий), видеомагнитофон (Понятов), гусеничный ход (Загряжский, Блинов)."}];
let mode='tr', dir='en', unit='all', deck=[], i=0, known=0, seen=0;
function pool(){ const s = mode==='tr'?VOC:QA; return s.filter(x=>unit==='all'||x.u===unit).map(x=>({...x})); }
function restart(){ deck=pool(); i=0; known=0; seen=0; show(); }
function show(){
  document.getElementById('card').classList.remove('open');
  const c = deck[i];
  document.getElementById('meta').textContent = deck.length ? 'Карточка ' + (i+1) + ' из ' + deck.length : 'Нет карточек';
  if(!c){ document.getElementById('front').textContent='Готово!'; document.getElementById('back').textContent=''; document.getElementById('lblF').textContent=''; }
  else {
    document.getElementById('lblF').textContent = mode==='tr' ? (dir==='en' ? 'Слово (англ.)' : 'Слово (рус.)') : 'Вопрос';
    document.getElementById('front').textContent = mode==='tr' ? (dir==='en' ? c.en : c.ru) : c.q;
    document.getElementById('frontRu').textContent = (mode==='qa' && c.qr) ? c.qr : '';
    document.getElementById('back').textContent = mode==='tr' ? (dir==='en' ? c.ru : c.en) : c.a;
    document.getElementById('backRu').textContent = (mode==='qa' && c.ar) ? c.ar : '';
  }
  document.getElementById('stats').textContent = 'Знаю: ' + known + ' из ' + seen;
}
function answer(ok){
  if(!deck.length) return;
  seen++;
  const c = deck[i];
  if(ok){ known++; deck.splice(i,1); if(i>=deck.length) i=0; }
  else { deck.splice(i,1); deck.push(c); if(i>=deck.length) i=0; }
  show();
}
function setMode(m){ mode=m; document.getElementById('m-tr').classList.toggle('on',m==='tr'); document.getElementById('m-qa').classList.toggle('on',m==='qa'); restart(); }
function setUnit(u){ unit=u; ['all','2','4'].forEach(x=>document.getElementById('u-'+x).classList.toggle('on',x===u)); restart(); }
function shuffle(){ for(let k=deck.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[deck[k],deck[j]]=[deck[j],deck[k]];} i=0; show(); }
function toggleDir(){ dir = dir==='en'?'ru':'en'; document.getElementById('dir').textContent = dir==='en'?'EN → RU':'RU → EN'; show(); }
restart();
</script>
